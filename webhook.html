</head>
<body>
 <header class="site-header">
    <a href="index.html#main" class="brand">Павлюк Дмитро</a>

    <nav class="nav">
      <a href="index.html#main" class="nav-link active">Головна</a>
      <a href="index.html#about" class="nav-link">Про мене</a>
      <a href="index.html#projects" class="nav-link">Практичні роботи</a>
      <a href="index.html#projects-2" class="nav-link">Лабораторні роботи</a>
    </nav>
  </header>

<main class="container">

    <div class="form-card">
        <h2>Реєстрація користувача</h2>
        
   
        <form action="https://webhook.site/e570752e-1d7d-46cd-a34b-7969419a8d09" method="POST">
            
            <div class="form-group">
                <label for="first_name">Ім'я *</label>
                <input type="text" id="first_name" name="first_name" required placeholder="Введіть ім'я">
            </div>

            <div class="form-group">
                <label for="last_name">Прізвище *</label>
                <input type="text" id="last_name" name="last_name" required placeholder="Введіть прізвище">
            </div>

            <div class="form-group">
                <label for="email">Електронна пошта *</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" name="password" required placeholder="Введіть пароль">
            </div>

            <div class="form-group">
                <label for="confirm_password">Підтвердження паролю *</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Повторіть пароль">
            </div>

            <div class="form-group">
                <label for="birthdate">Дата народження</label>
                <input type="date" id="birthdate" name="birthdate">
            </div>

            <div class="form-group">
                <label for="gender">Стать</label>
                <select id="gender" name="gender">
                    <option value="">-- Оберіть стать --</option>
                    <option value="male">Чоловіча</option>
                    <option value="female">Жіноча</option>
                    <option value="other">Інша</option>
                </select>
            </div>

            <input type="submit" value="Зареєструватися">
        </form>
    </div>
</main>
<footer class="site-footer">
    <div class="footer-inner">
      <span>Контактні дані</span>
      <a href="[GITHUB URL]" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </footer>
</body>
</html>
