
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клавіатура</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Клавіатура</h1>

    <div class="keyboard">

        <!-- Main keyboard -->
        <div class="main-board">
            <div class="function-row" id="function-row"></div>
            <div class="key-row" id="number-row"></div>
            <div class="key-row" id="q-row"></div>
            <div class="key-row" id="a-row"></div>
            <div class="key-row" id="z-row"></div>
            <div class="key-row" id="bottom-row"></div>
        </div>

        <!-- Navigation and arrow keys -->
        <div class="navigation">
            <div class="nav-grid" id="nav-grid"></div>
            <div class="arrow-grid" id="arrow-grid"></div>
        </div>

        <!-- Numeric keypad -->
        <div class="numpad" id="numpad"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
